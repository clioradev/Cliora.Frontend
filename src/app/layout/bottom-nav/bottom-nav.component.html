<nav class="bottom-nav">
  <div class="bottom-nav__inner">
    <button type="button" class="bottom-nav__item" [disabled]="!continuarDestino()" (click)="onContinuar()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
      <span class="bottom-nav__label">Continuar</span>
    </button>

    <a
      class="bottom-nav__item"
      routerLink="/"
      routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8" />
      </svg>
      <span class="bottom-nav__label">Universos</span>
    </a>

    @if (mostrarAutor()) {
      <a class="bottom-nav__item" routerLink="/autor" routerLinkActive="bottom-nav__item--active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 21v-3.75L14.81 5.44a1 1 0 0 1 1.41 0l1.34 1.34a1 1 0 0 1 0 1.41L5.75 21H3z"
            fill="currentColor"
          />
        </svg>
        <span class="bottom-nav__label">Autor</span>
      </a>
    }

    <div class="bottom-nav__mas">
      <button
        type="button"
        class="bottom-nav__item"
        [class.bottom-nav__item--active]="masActivo() || menuAbierto()"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuAbierto()"
        (click)="toggleMenu()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="12" r="2" fill="currentColor" />
          <circle cx="12" cy="12" r="2" fill="currentColor" />
          <circle cx="19" cy="12" r="2" fill="currentColor" />
        </svg>
        <span class="bottom-nav__label">Más…</span>
      </button>

      @if (menuAbierto()) {
        <div class="mas-menu" role="menu">
          @for (opcion of opcionesUsuario; track opcion.ruta) {
            <a class="mas-menu__item" role="menuitem" [routerLink]="opcion.ruta" routerLinkActive="mas-menu__item--active">
              {{ opcion.texto }}
            </a>
          }

          @if (opcionesAdmin().length > 0) {
            <hr class="mas-menu__separador" />
            @for (opcion of opcionesAdmin(); track opcion.ruta) {
              <a class="mas-menu__item" role="menuitem" [routerLink]="opcion.ruta" routerLinkActive="mas-menu__item--active">
                {{ opcion.texto }}
              </a>
            }
          }

          <hr class="mas-menu__separador" />
          <button type="button" class="mas-menu__item mas-menu__item--peligro" role="menuitem" (click)="cerrarSesion()">
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</nav>
