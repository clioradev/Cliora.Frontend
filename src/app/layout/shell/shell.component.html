<div class="shell">
  <header class="shell-header">
    <img
      class="shell-header__brand marca-claro"
      src="/media/logos/Cliora-fondo-claro-reducido.png"
      alt="Cliora"
    />
    <img
      class="shell-header__brand marca-oscuro"
      src="/media/logos/Cliora-fondo-oscuro-reducido.png"
      alt="Cliora"
    />
  </header>

  <div class="shell-body">
    <main class="shell-content">
      <router-outlet />
    </main>
  </div>

  @if (authService.isAuthenticated()) {
    <app-bottom-nav />
  }
</div>
