<app-modal (cerrar)="cerrado.emit()">
  <h3>{{ caracteristica() ? 'Editar característica' : 'Añadir nueva característica' }}</h3>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Nombre
      <input type="text" formControlName="nombre" />
    </label>

    <label>
      Descripción
      <app-area-texto formControlName="descripcion" [rows]="3" tituloEditor="Descripción de la característica" />
    </label>

    <label>
      Tipo
      <select formControlName="idCatTipoCaracteristica">
        @for (tipo of tipos(); track tipo.idCatTipoCaracteristica) {
          <option [value]="tipo.idCatTipoCaracteristica">{{ tipo.nombre }}</option>
        }
      </select>
    </label>

    <label>
      Valor inicial
      <select formControlName="origenValor">
        <option [value]="origenNumero">Un número</option>
        @for (grupo of gruposAnteriores(); track grupo.ordenAventura) {
          <optgroup [label]="'Heredar de #' + grupo.ordenAventura + ' ' + grupo.tituloAventura">
            @for (anterior of grupo.caracteristicas; track anterior.idCaracteristica) {
              <option [value]="anterior.idCaracteristica">{{ anterior.nombre }}</option>
            }
          </optgroup>
        }
        @if (anteriorFueraDeLista(); as id) {
          <option [value]="id">Característica de una versión anterior</option>
        }
      </select>
    </label>

    @if (heredaValor()) {
      <p class="caracteristica-form-modal__ayuda">
        Empieza con el valor que el personaje tenía en esa característica al acabar la aventura anterior.
      </p>
    } @else {
      <label>
        Número
        <input type="number" formControlName="valorInicial" />
      </label>
    }

    <label class="caracteristica-form-modal__checkbox">
      <input type="checkbox" formControlName="visible" />
      Visible para el jugador
    </label>

    @if (error()) {
      <p class="status status--error">{{ error() }}</p>
    }

    <div class="caracteristica-form-modal__acciones">
      <button type="button" (click)="cerrado.emit()">Cancelar</button>
      <button type="submit" class="btn--primary" [disabled]="form.invalid || guardando()">
        {{ guardando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-modal>
