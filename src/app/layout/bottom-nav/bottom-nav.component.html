<nav class="bottom-nav">
  <div class="bottom-nav__inner">
    <button type="button" class="bottom-nav__item" [disabled]="!continuarDestino()" (click)="onContinuar()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" /></svg>
      <span class="bottom-nav__label">Continuar</span>
    </button>

    <a
      class="bottom-nav__item"
      routerLink="/"
      routerLinkActive="bottom-nav__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8" />
      </svg>
      <span class="bottom-nav__label">Universos</span>
    </a>

    @if (mostrarAutor()) {
      <a class="bottom-nav__item" routerLink="/autor" routerLinkActive="bottom-nav__item--active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 21v-3.75L14.81 5.44a1 1 0 0 1 1.41 0l1.34 1.34a1 1 0 0 1 0 1.41L5.75 21H3z"
            fill="currentColor"
          />
        </svg>
        <span class="bottom-nav__label">Autor</span>
      </a>
    }

    <a class="bottom-nav__item" routerLink="/configuracion" routerLinkActive="bottom-nav__item--active">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle
          cx="12"
          cy="12"
          r="8"
          pathLength="100"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-dasharray="6.25 6.25"
        />
        <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8" />
      </svg>
      <span class="bottom-nav__label">Configuración</span>
    </a>
  </div>
</nav>
