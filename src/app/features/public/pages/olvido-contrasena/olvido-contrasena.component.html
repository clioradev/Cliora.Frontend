@if (enviado()) {
  <p class="olvido-form__mensaje">
    Si existe una cuenta con ese email, te hemos enviado un enlace para restablecer tu contraseña.
  </p>
} @else {
  <form class="olvido-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <h1>He olvidado mi contraseña</h1>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
    </label>

    @if (error()) {
      <p class="olvido-form__error">{{ error() }}</p>
    }

    <button type="submit" class="btn--primary" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Enviando…' : 'Enviar enlace' }}
    </button>

    <a routerLink="/login">Volver</a>
  </form>
}
