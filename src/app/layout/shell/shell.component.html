<div class="shell">
  <header class="shell-header">
    <button
      type="button"
      class="shell-header__hamburger"
      (click)="sidebarAbierto.set(true)"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <span class="shell-header__brand">Cliora</span>
  </header>

  <div class="shell-body">
    <app-sidebar [abierto]="sidebarAbierto()" (cerrar)="sidebarAbierto.set(false)" />

    <main class="shell-content">
      <router-outlet />
    </main>
  </div>
</div>
