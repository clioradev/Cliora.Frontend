<form class="registro-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h1>Crear cuenta</h1>

  <label>
    Nombre
    <input type="text" formControlName="nombre" autocomplete="name" />
  </label>

  <label>
    Email
    <input type="email" formControlName="email" autocomplete="email" />
  </label>

  <label>
    Contraseña
    <input type="password" formControlName="password" autocomplete="new-password" />
  </label>

  <label>
    Confirmar contraseña
    <input type="password" formControlName="confirmarPassword" autocomplete="new-password" />
  </label>

  @if (form.errors?.['passwordsDistintas'] && form.controls.confirmarPassword.touched) {
    <p class="registro-form__error">Las contraseñas no coinciden.</p>
  }

  @if (errors().length) {
    <ul class="registro-form__error">
      @for (mensaje of errors(); track mensaje) {
        <li>{{ mensaje }}</li>
      }
    </ul>
  }

  <button type="submit" class="btn--primary" [disabled]="form.invalid || submitting()">
    {{ submitting() ? 'Creando…' : 'Crear cuenta' }}
  </button>

  <a routerLink="/login">Volver</a>
</form>
