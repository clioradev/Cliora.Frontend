@if (loading()) {
  <p class="status">Cargando aventura…</p>
} @else if (error()) {
  <p class="status status--error">No se ha podido cargar la aventura.</p>
} @else if (notFound()) {
  <p class="status status--error">No se ha encontrado la aventura.</p>
  <a routerLink="/">← Volver</a>
} @else if (contexto(); as c) {
  <a class="portada__volver" routerLink="/">← Volver</a>

  <app-aventura-detalle [aventura]="c.aventura" [campana]="c.campana" [universo]="c.universo" (cambiado)="recargar()" />
}
