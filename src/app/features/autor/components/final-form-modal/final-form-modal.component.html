<app-modal (cerrar)="cerrado.emit()">
  <h3>{{ final() ? 'Editar final' : 'Añadir nuevo final' }}</h3>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Título
      <input type="text" formControlName="titulo" />
    </label>

    <label>
      Texto
      <app-area-texto formControlName="texto" [rows]="6" tituloEditor="Texto del final" />
    </label>

    <div class="final-form-modal__imagen">
      @if (rutaImagen(); as ruta) {
        <div class="adjunto-chip">
          <app-icono nombre="imagen" />
          <span class="adjunto-chip__ruta">{{ ruta }}</span>
          <button
            type="button"
            class="btn-icono btn-icono--peligro"
            (click)="eliminarImagen()"
            aria-label="Quitar imagen"
            title="Quitar imagen"
          >
            <app-icono nombre="eliminar" />
          </button>
        </div>
      }

      <input
        #imagenInput
        type="file"
        accept="image/png,image/jpeg,image/webp"
        hidden
        (change)="seleccionarImagen($any($event.target).files); imagenInput.value = ''"
      />
      <button
        type="button"
        class="btn-icono btn-icono--primary"
        [class.btn-icono--activo]="rutaImagen()"
        (click)="imagenInput.click()"
        [attr.aria-label]="rutaImagen() ? 'Cambiar imagen' : 'Añadir imagen'"
        [attr.title]="rutaImagen() ? 'Cambiar imagen' : 'Añadir imagen'"
      >
        <app-icono nombre="imagen" />
      </button>
    </div>

    @if (error()) {
      <p class="status status--error">{{ error() }}</p>
    }

    <div class="final-form-modal__acciones">
      <button type="button" (click)="cerrado.emit()">Cancelar</button>
      <button type="submit" class="btn--primary" [disabled]="form.invalid || guardando()">
        {{ guardando() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</app-modal>
