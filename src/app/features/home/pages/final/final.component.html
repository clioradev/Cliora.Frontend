@if (loading()) {
  <p class="status">Cargando…</p>
} @else if (error()) {
  <p class="status status--error">No se ha podido cargar el final.</p>
} @else if (final(); as f) {
  <p class="final__texto">{{ f.texto }}</p>

  <button type="button" class="btn--primary" (click)="finalizarAventura()" [disabled]="finalizando()">
    Finalizar aventura
  </button>

  @if (idAventuraFinalizada(); as idAventura) {
    <app-valoracion-modal [idAventura]="idAventura" (cerrado)="onValoracionCerrada()" />
  }
}
