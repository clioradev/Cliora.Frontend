<form class="password-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <label>
    Contraseña actual
    <input type="password" formControlName="passwordActual" autocomplete="current-password" />
  </label>

  <label>
    Nueva contraseña
    <input type="password" formControlName="passwordNueva" autocomplete="new-password" />
  </label>

  <label>
    Confirmar nueva contraseña
    <input type="password" formControlName="confirmarPassword" autocomplete="new-password" />
  </label>

  @if (form.errors?.['passwordsDistintas'] && form.controls.confirmarPassword.touched) {
    <p class="password-form__error">Las contraseñas no coinciden.</p>
  }

  @if (error()) {
    <p class="password-form__error">{{ error() }}</p>
  }

  <button type="submit" class="btn--primary" [disabled]="form.invalid || guardando()">
    {{ guardando() ? 'Guardando…' : 'Cambiar contraseña' }}
  </button>
</form>
