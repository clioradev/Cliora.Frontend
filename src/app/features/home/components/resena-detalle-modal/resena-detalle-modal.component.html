<app-modal (cerrar)="cerrado.emit()">
  <h3>{{ valoracion().nombreUsuario }}</h3>

  <app-star-rating-display [value]="valoracion().puntuacion" />
  <span class="resena-detalle__fecha">{{ valoracion().fecha | date: 'dd/MM/yyyy' }}</span>

  @if (valoracion().comentario) {
    <p class="resena-detalle__comentario">{{ valoracion().comentario }}</p>
  }
</app-modal>
